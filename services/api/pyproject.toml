[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["seed", "seed_inventory", "database", "models", "schemas", "auth_models", "auth_db", "auth"]

[tool.setuptools.packages.find]
include = ["seed*", "database*", "models*", "schemas*", "auth_models*", "auth_db*", "auth*", "routes*", "incidents*"]

[project]
name = "trackflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "uvicorn>=0.36",
    "python-multipart>=0.0.20",
    "tinydb>=4.8",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.1.2",
    "python-dotenv>=1.1",
    "sqlmodel>=0.0.42",
    "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

[dependency-groups]
dev = ["pytest-cov>=7.1"]

[project.scripts]
seed = "seed:run_seed"
seed-inventory = "seed_inventory:run_inventory_seed"
