authors = [
    { name = "Hugo Villar", email = "97517388+Hugo-VC@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.40.0",
