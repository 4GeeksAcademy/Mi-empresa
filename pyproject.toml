[project]
name = "mi-empresa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hugo Villar", email = "97517388+Hugo-VC@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3,<4",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "mcp>=1.26,<2",
    "mcpauth>=0.1.1",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pandas>=3.1.0",
    "py-readability-metrics>=1.4.5",
    "pytest>=9.2.0",
    "qdrant-client>=1.15,<1.17",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
mi-empresa = "mi_empresa:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
