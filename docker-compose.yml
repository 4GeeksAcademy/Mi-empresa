services:
  interfaces:
    build:
      context: .
      dockerfile: uis/Dockerfile
    working_dir: /app
    env_file:
      - .env
    environment:
      INVENTORY_API_INTERNAL_URL: ${INVENTORY_API_INTERNAL_URL:-http://backend:8000}
      INCIDENTS_API_INTERNAL_URL: ${INCIDENTS_API_INTERNAL_URL:-http://backend:8000}
      TELEMETRY_ENDPOINT: http://backend:8000/telemetry/events
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
      - "${BACKOFFICE_PORT:-3001}:3001"
    volumes:
      - ./uis:/app
      - ./src:/src:ro
      - ./docs/telemetry:/docs/telemetry:ro
      - website_node_modules:/app/website/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
    networks:
      - trackflow-dev
    depends_on:
      backend:
        condition: service_healthy
    command: ["bash", "/app/start.sh"]

  backend:
    build: &api-build
      context: .
      dockerfile: services/Dockerfile
    working_dir: /app/services/api
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/services/api
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_DATA_DIR: /var/lib/trackflow/tasks
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./services:/app/services
      - ./packages:/app/packages:ro
      - ./docs/telemetry:/docs/telemetry:ro
      - task_data:/var/lib/trackflow/tasks
    networks:
      - trackflow-dev
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trackflow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: *api-build
    working_dir: /app/services/api
    environment:
      PYTHONPATH: /app:/app/services/api
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_DATA_DIR: /var/lib/trackflow/tasks
    command: ["celery", "-A", "services.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--events"]
    volumes:
      - ./services:/app/services
      - ./packages:/app/packages:ro
      - task_data:/var/lib/trackflow/tasks
    networks:
      - trackflow-dev
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 330s

  flower:
    build: *api-build
    working_dir: /app/api
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FLOWER_UNAUTHENTICATED_API: "true"
    command: ["celery", "-A", "services.celery_app", "flower", "--port=5555", "--persistent=True", "--db=/var/lib/flower/flower"]
    ports:
      - "5555:5555"
    volumes:
      - flower_data:/var/lib/flower
    networks:
      - trackflow-dev
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: services/Dockerfile
    working_dir: /app
    env_file:
      - .env
    environment:
      TZ: UTC
    command: ["python", "scripts/nightly_scheduler.py"]
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - ./data/raw:/app/data/raw
    networks:
      - trackflow-dev

volumes:
  website_node_modules:
  backoffice_node_modules:
  redis_data:
  task_data:
  flower_data:

networks:
  trackflow-dev:
    name: trackflow-dev